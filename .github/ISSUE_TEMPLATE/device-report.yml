name: Device report
description: >
  Report whether oplus_bsp_task_overload is present on your device and what
  it does under sustained load. Most useful from a non-OnePlus-13 OPLUS phone.
title: "device-report: "
body:
  - type: markdown
    attributes:
      value: |
        Diagnosis is read-only. Prefer pasting `tools/collect-report.sh` output.
        Redact UIDs >= 10000 to `10xxx` before submitting. Do not attach logcat
        or a bugreport. See `docs/PRIVACY.md`.

  - type: input
    id: model
    attributes:
      label: Model
      description: Marketing name and model code.
      placeholder: CPH2653 (OnePlus 13)
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Build
      description: Incremental / OTA identifier, plus Android version if you have it.
      placeholder: CPH2653_16.0.9.401, Android 16
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`.
      placeholder: 6.6.118-android15-8
    validations:
      required: true

  - type: dropdown
    id: module_present
    attributes:
      label: Is oplus_bsp_task_overload present?
      description: >
        `grep oplus_bsp_task_overload /proc/modules` and/or
        `ls /proc/task_overload/`.
      options:
        - "yes — module loaded"
        - "yes — /proc/task_overload is readable"
        - "module loaded, /proc/task_overload not readable"
        - "no — not present"
        - unknown / could not check
    validations:
      required: true

  - type: textarea
    id: cpu_capacity
    attributes:
      label: cpu_capacity line
      description: >
        One line per CPU from `/sys/devices/system/cpu/cpu*/cpu_capacity`.
        Example from the reference unit — `cpu0-5=792 cpu6-7=1024`.
      placeholder: cpu0=792 cpu1=792 cpu2=792 cpu3=792 cpu4=792 cpu5=792 cpu6=1024 cpu7=1024
      render: text
    validations:
      required: true

  - type: textarea
    id: limit_flag
    attributes:
      label: Clamped limit_flag values seen
      description: >
        Values other than 1024 from `/proc/task_overload/abnormal_task` while
        an app was under sustained load. Include the matching `freq` column
        if you have it. Redact uid to 10xxx.
      placeholder: "466 at freq 3283200; 346 at freq 2438400"
      render: text
    validations:
      required: false

  - type: input
    id: benchmark
    attributes:
      label: Benchmark score and version
      description: >
        Named benchmark, exact version, single-core and multi-core if both
        exist. Leave blank if you did not run one.
      placeholder: "Geekbench 7.0.0  934 / 6017"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: >
        Screen state, whether you force-stopped the app first, starting
        temperature, anything odd. Optional paste of collect-report.sh
        output belongs here.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have redacted all UIDs >= 10000 to 10xxx
          required: true
